  '<div class="tu-range"><span>المدة</span><b class="tu-num" id="tuYL"></b></div><input type="range" id="tuY" min="6" max="36" step="6" value="12" aria-label="عدد الشهور">'+
  '<div class="tu-calc tu-num"><div><span>المقدّم</span><b id="tuDpV"></b></div><div><span>القسط الشهري</span><b id="tuMV"></b></div></div>'+
  '<p class="tu-note">حساب تقديري بدون فوائد عشان تعرف حدود ميزانيتك. نظام السداد المتاح بيتحدد مع المالك، اسألنا عليه.</p></div>'}
function wireCalc(u){var s=$("#tuScrim"),dp=s.querySelector("#tuDp"),y=s.querySelector("#tuY");
  function run(){var d=Math.round(u.price*dp.value/100),m=Math.round((u.price-d)/y.value);
    s.querySelector("#tuDpL").textContent=dp.value+"%";s.querySelector("#tuYL").textContent=y.value+" شهر";
    s.querySelector("#tuDpV").textContent=fmt(d)+" جنيه";s.querySelector("#tuMV").textContent=fmt(m)+" جنيه"}
  dp.oninput=y.oninput=run;run()}
function compare(){
  var us=UNITS.filter(function(u){return has(st.cmp,u.id)});
  function row(h,f){return '<tr><th>'+h+'</th>'+us.map(function(u){return '<td>'+f(u)+'</td>'}).join("")+'</tr>'}
  sheet("مقارنة الوحدات",'<div class="tu-tblwrap"><table class="tu-num"><thead><tr><th></th>'+us.map(function(u){return '<td><b>'+esc(u.title)+'</b><br><span style="color:var(--tu-muted);font-size:12.5px">'+codeLabel(u)+'</span></td>'}).join("")+'</tr></thead><tbody>'+
   row("العرض",function(u){return u.deal==="rent"?"إيجار":"بيع"})+row("السعر",function(u){return u.price?fmt(u.price)+(u.deal==="rent"?" جنيه/شهر":" جنيه"):"اسأل عن السعر"})+
   row("المساحة",function(u){return u.area+" م²"})+row("سعر المتر",function(u){return u.deal==="sale"&&u.price?fmt(Math.round(u.price/u.area))+" جنيه":"—"})+
   row("الدور",function(u){return esc(u.floor)})+row("الغرف",function(u){return u.beds+" نوم + ريسبشن"})+row("المميزات",function(u){return u.tags.map(esc).join("<br>")})+
   row("",function(u){return '<a class="tu-btn wa" target="_blank" rel="noopener" href="'+waLink(bookMsg(u))+'">احجز معاينة</a>'})+'</tbody></table></div>');
}
function topOff(){var hd=document.querySelector("header");ROOT.style.setProperty("--tu-top",(hd&&getComputedStyle(hd).position!=="static"?hd.offsetHeight:0)+"px")}
topOff();window.addEventListener("resize",topOff);
stats();sync();render();

var h=(location.hash||"").replace(/^#/,""), hit=null;
UNITS.forEach(function(u){if(h==="u-"+u.id||(u.anchor&&h===u.anchor))hit=u});
if(hit){var el=document.getElementById("u-"+hit.id);if(el)el.scrollIntoView();openUnit(hit.id,0)}
})();
